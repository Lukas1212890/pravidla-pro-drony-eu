name: Finalize repository import

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify archive
        shell: bash
        run: |
          set -euo pipefail
          cat .repo-import/z00 .repo-import/z01 .repo-import/z02 .repo-import/z03 \
              .repo-import/z04 .repo-import/z05 .repo-import/z06 .repo-import/z07 \
              .repo-import/z08 .repo-import/z08_tail .repo-import/z09 .repo-import/z10 \
              .repo-import/z11_15 .repo-import/z11tail_a .repo-import/z11tail_b \
              > /tmp/runtime.b64
          test "$(wc -c < /tmp/runtime.b64)" -eq 122760
          base64 --decode /tmp/runtime.b64 > /tmp/runtime-only.zip
          echo "523558e08570b8db3d2af83e02b203863e6015d9825b376ca27afedd0a4d7f53  /tmp/runtime-only.zip" | sha256sum --check --strict

      - name: Import application source
        shell: bash
        run: |
          set -euo pipefail
          unzip -o /tmp/runtime-only.zip -d .
          rm -rf .repo-import
          rm -f .github/workflows/finalize-import.yml

      - name: Validate project
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run lint
          npm run build
          rm -rf node_modules dist

      - name: Commit final repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import complete application source"
          git push
